name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      # Full cross-browser matrix on push to main; chromium-only on PRs
      # for speed, since playwright.config.ts reads this same variable.
      PLAYWRIGHT_FULL_MATRIX: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers (chromium only)
        if: env.PLAYWRIGHT_FULL_MATRIX != '1'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browsers (full matrix)
        if: env.PLAYWRIGHT_FULL_MATRIX == '1'
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces
          path: test-results/
          retention-days: 14

  verify:
    name: Verify
    needs: [lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
