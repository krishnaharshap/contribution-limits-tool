name: Bug report
description: Something in the tool isn't working correctly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Enter '...'
        3. See error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 130 on Windows 11
    validations:
      required: false
